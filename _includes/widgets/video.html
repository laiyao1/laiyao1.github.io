<section class="homepage-video my-3 bg-white shadow-sm rounded-xl" aria-labelledby="homepage-video-title" aria-roledescription="carousel" tabindex="0">
    <h6 class="p-3 mb-0 border-bottom border-gray" id="homepage-video-title">
        <i class="fas fa-rss" aria-hidden="true"></i> Video
    </h6>
    <div class="video-container">
        <button class="video-nav left" type="button" id="prevVideo" aria-label="Previous video" aria-controls="slidesContainer">&#8249;</button>
        <div class="video-slide-wrapper" id="videoWrapper">
            <div class="video-slides-container" id="slidesContainer">
                <iframe class="video-slide active" width="560" height="315"
                    src="https://www.youtube.com/embed/p3XO6bUBvpM?si=nZljjmorwvCY5C1g"
                    title="How does an arithmetic hardware work?" tabindex="0" aria-hidden="false"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen></iframe>
                <iframe class="video-slide" width="560" height="315"
                    src="https://www.youtube.com/embed/9-EQmDjRLHQ?si=EuVqns8LDZLwERgJ"
                    title="What is inside a computer microchip?" tabindex="-1" aria-hidden="true"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen></iframe>
            </div>
        </div>
        <button class="video-nav right" type="button" id="nextVideo" aria-label="Next video" aria-controls="slidesContainer">&#8250;</button>
    </div>
    <div class="video-indicators" id="indicators" role="group" aria-label="Choose a video"></div>
    <p class="sr-only" id="videoStatus" aria-live="polite" aria-atomic="true"></p>
</section>

<style>
.homepage-video .video-container {
    position: relative;
    padding: 16px;
}
.homepage-video .video-slide-wrapper {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 12px;
    touch-action: pan-y;
}
.homepage-video .video-slides-container {
    display: flex;
    transition: transform 0.4s ease;
}
.homepage-video .video-slide {
    display: block;
    flex: 0 0 100%;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    border: 0;
}
.homepage-video .video-nav {
    position: absolute;
    top: 50%;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid #dee2e6;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    color: #343a40;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    transform: translateY(-50%);
}
.homepage-video .video-nav:hover {
    background: #f1f3f5;
}
.homepage-video .video-nav.left { left: 8px; }
.homepage-video .video-nav.right { right: 8px; }
.homepage-video .video-indicators {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 0 16px 16px;
}
.homepage-video .indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
}
.homepage-video .indicator::before {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #adb5bd;
    content: "";
}
.homepage-video .indicator.active::before { background: #007bff; }
.homepage-video:focus-visible,
.homepage-video button:focus-visible {
    outline: 2px solid #007bff;
    outline-offset: 3px;
}
@media (prefers-reduced-motion: reduce) {
    .homepage-video .video-slides-container { transition: none; }
}
</style>

<script>
(function () {
    function initializeVideoCarousel() {
        const root = document.querySelector('.homepage-video');
        if (!root) return;
        const slidesContainer = root.querySelector('#slidesContainer');
        const videoWrapper = root.querySelector('#videoWrapper');
        const indicators = root.querySelector('#indicators');
        const status = root.querySelector('#videoStatus');
        const videos = Array.from(root.querySelectorAll('.video-slide'));
        if (!videos.length) return;
        let currentIndex = 0;
        let dragStart = null;

        const indicatorButtons = videos.map((video, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'indicator';
            button.setAttribute('aria-label', `Show video ${index + 1}: ${video.title}`);
            button.setAttribute('aria-controls', 'slidesContainer');
            button.addEventListener('click', () => goToSlide(index));
            indicators.appendChild(button);
            return button;
        });

        function render(announce) {
            slidesContainer.style.transform = `translateX(${-currentIndex * 100}%)`;
            videos.forEach((video, index) => {
                const active = index === currentIndex;
                video.classList.toggle('active', active);
                video.tabIndex = active ? 0 : -1;
                video.setAttribute('aria-hidden', String(!active));
                indicatorButtons[index].classList.toggle('active', active);
                indicatorButtons[index].setAttribute('aria-current', String(active));
            });
            if (announce) {
                status.textContent = `Video ${currentIndex + 1} of ${videos.length}: ${videos[currentIndex].title}`;
            }
        }

        function goToSlide(index) {
            currentIndex = (index + videos.length) % videos.length;
            render(true);
        }

        root.querySelector('#prevVideo').addEventListener('click', () => goToSlide(currentIndex - 1));
        root.querySelector('#nextVideo').addEventListener('click', () => goToSlide(currentIndex + 1));
        root.addEventListener('keydown', event => {
            if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
            if (event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
            if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
                event.preventDefault();
                goToSlide(currentIndex + (event.key === 'ArrowLeft' ? -1 : 1));
            }
        });

        videoWrapper.addEventListener('pointerdown', event => {
            if (event.button !== 0) return;
            dragStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
            videoWrapper.setPointerCapture(event.pointerId);
        });
        videoWrapper.addEventListener('pointerup', event => {
            if (!dragStart || dragStart.id !== event.pointerId) return;
            const deltaX = event.clientX - dragStart.x;
            const deltaY = event.clientY - dragStart.y;
            dragStart = null;
            if (Math.abs(deltaX) > videoWrapper.clientWidth * 0.2 && Math.abs(deltaX) > Math.abs(deltaY)) {
                goToSlide(currentIndex + (deltaX < 0 ? 1 : -1));
            }
        });
        videoWrapper.addEventListener('pointercancel', () => { dragStart = null; });
        videoWrapper.addEventListener('lostpointercapture', () => { dragStart = null; });
        render(false);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeVideoCarousel, { once: true });
    } else {
        initializeVideoCarousel();
    }
})();
</script>
